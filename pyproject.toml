[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "eco-retail-platform"
version = "2.0.0"
description = "AI-driven dynamic pricing engine to reduce perishable food waste and optimize retail revenue"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
streamlit = ["streamlit>=1.28.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["ai*", "ml*", "db*", "etl*", "api*", "dashboard*"]
